<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon -->
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Typefaces. Until Oct 2026 the site declared no font at all: Tailwind's
         stock font-sans/serif/mono stacks resolved to whatever the visitor's OS
         supplied, so the brand read differently on every device and matched
         neither the credentials deck nor the poster system. These three are the
         poster system's faces, which makes the social work and the site agree.
         Loaded here rather than via @import so they start downloading with the
         document; prerender.mjs strips only the title/description/canonical/og
         tags, so this survives into every route's static HTML. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Merriweather:ital,wght@0,400;0,700;1,300&family=Space+Mono:wght@400;700&display=swap"
    />

    <!-- Title -->
    <title>HOOOP Collective | Sustainable Marketing, ESG & Growth Strategy</title>

    <!-- Meta Description -->
<meta name="description" content="HOOOP is a strategy collective focused on climate communication, sustainable marketing, and behavioural design. We help brands translate climate action into growth." />


    <!-- Canonical -->
    <link rel="canonical" href="https://www.hooop.in/" />

    <!-- Agentic Resource Discovery. One of the four places an AI agent looks for
         the resource catalogue; robots.txt carries the Agentmap line as well. -->
    <link rel="ai-catalog" href="https://www.hooop.in/.well-known/ai-catalog.json" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.hooop.in/" />
    <meta property="og:title" content="HOOOP Collective | Sustainable Marketing, ESG & Growth Strategy" />
    <meta
      property="og:description"
      content="HOOOP is a sustainability and marketing collective helping brands align growth, climate impact, and regulation through strategy, media intelligence, and behavioural design."
    />
    <meta
      property="og:image"
      content="https://www.hooop.in/THE-HOOO-COLLECTIVEP_without-shadow.png"
    />
    <meta property="og:site_name" content="HOOOP Collective" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HOOOP Collective | Sustainable Marketing, ESG & Growth Strategy" />
    <meta
      name="twitter:description"
      content="Strategy, media intelligence, and behavioural design for brands building sustainable growth."
    />
    <meta
      name="twitter:image"
      content="https://www.hooop.in/THE-HOOO-COLLECTIVEP_without-shadow.png"
    />

    <!-- Organization Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "HOOOP Collective",
      "alternateName": ["The HOOOP Collective", "HOOOP"],
      "url": "https://www.hooop.in",
      "logo": "https://www.hooop.in/THE-HOOO-COLLECTIVEP_without-shadow.png",
      "sameAs": [
        "https://www.linkedin.com/company/hooopcollective/",
        "https://www.instagram.com/hooopcollective/"
      ],
      "description": "HOOOP is a sustainability and marketing collective that helps brands grow through ESG-aligned strategy, media intelligence, and behaviour-led design."
    }
    </script>
    <!-- Google Analytics (GA4) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-EY41XQ0YH2"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-EY41XQ0YH2');
</script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
